<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Work Calendar</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto">

        <!-- Main Card -->
        <div class="bg-white border border-gray-300 shadow-sm">

            <!-- Header -->
            <div class="bg-gray-200 px-4 py-2 flex items-center justify-between border-b">
                <h1 class="text-sm font-medium text-gray-700">
                    Add Work Calendar
                </h1>

                <button
                    type="button"
                    class="text-gray-500 hover:text-gray-800 text-lg leading-none"
                    aria-label="Close">
                    ×
                </button>
            </div>

            <!-- Content -->
            <div class="p-4">

                <h2 class="text-sm font-medium text-gray-700 mb-3">
                    Define weekend
                </h2>

                <!-- Half Working Day Checkbox -->
                <div class="flex items-center gap-2 mb-5">
                    <input
                        type="checkbox"
                        id="halfWorkingDay"
                        class="w-4 h-4 accent-blue-500 cursor-pointer">

                    <label
                        for="halfWorkingDay"
                        class="text-xs text-gray-600 cursor-pointer">
                        Half working day & half weekend
                    </label>
                </div>


                <!-- Calendar Table -->
                <div class="bg-gray-100 rounded-md p-3 overflow-x-auto">

                    <table class="w-full min-w-[650px] text-xs">

                        <!-- Table Header -->
                        <thead>
                            <tr>
                                <th class="w-28"></th>

                                <th class="font-normal text-gray-500 pb-2">
                                    All
                                </th>

                                <th class="font-normal text-gray-500 pb-2">
                                    1st
                                </th>

                                <th class="font-normal text-gray-500 pb-2">
                                    2nd
                                </th>

                                <th class="font-normal text-gray-500 pb-2">
                                    3rd
                                </th>

                                <th class="font-normal text-gray-500 pb-2">
                                    4th
                                </th>

                                <th class="font-normal text-gray-500 pb-2">
                                    5th
                                </th>
                            </tr>
                        </thead>

                        <!-- Table Body -->
                        <tbody id="calendarBody"></tbody>

                    </table>

                </div>


                <!-- Calendar Year Definition -->
                <div class="mt-5 text-xs text-gray-700">
                    Calendar year definition
                </div>

            </div>


            <!-- Footer -->
            <div class="bg-gray-100 px-4 py-2 flex gap-2">

                <button
                    type="button"
                    class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-4 py-1.5 rounded">
                    Save
                </button>

                <button
                    type="button"
                    class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 text-xs px-4 py-1.5 rounded">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        const days = [
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday"
        ];

        const weeks = [
            "All",
            "1st",
            "2nd",
            "3rd",
            "4th",
            "5th"
        ];

        const calendarBody = document.getElementById("calendarBody");
        const halfWorkingDay = document.getElementById("halfWorkingDay");


        // Create table rows
        function createCalendar() {

            calendarBody.innerHTML = "";

            days.forEach((day, dayIndex) => {

                const row = document.createElement("tr");

                // Day name
                const dayCell = document.createElement("td");

                dayCell.className =
                    "bg-white border-2 border-gray-100 px-3 py-2 text-gray-700 rounded";

                dayCell.textContent = day;

                row.appendChild(dayCell);


                // Week columns
                weeks.forEach((week, weekIndex) => {

                    const cell = document.createElement("td");

                    cell.className =
                        "bg-white border-2 border-gray-100 text-center px-2 py-2";


                    const container = document.createElement("div");

                    container.className =
                        "flex items-center justify-center gap-2";


                    // Checkbox
                    const checkbox = document.createElement("input");

                    checkbox.type = "checkbox";

                    checkbox.className =
                        "w-4 h-4 accent-blue-500 cursor-pointer";

                    // Saturday is selected by default
                    if (dayIndex === 6) {
                        checkbox.checked = true;
                    }


                    container.appendChild(checkbox);


                    // Dropdown
                    const select = document.createElement("select");

                    select.className =
                        "half-dropdown hidden border border-gray-300 rounded px-1 py-1 text-xs text-gray-600 bg-white focus:outline-none focus:ring-1 focus:ring-blue-400";

                    select.innerHTML = `
                        <option value="full">Full Day</option>
                        <option value="first">1st Half</option>
                        <option value="second">2nd Half</option>
                    `;

                    container.appendChild(select);

                    cell.appendChild(container);

                    row.appendChild(cell);

                });

                calendarBody.appendChild(row);

            });

        }


        // Show / hide dropdowns
        halfWorkingDay.addEventListener("change", function () {

            const dropdowns =
                document.querySelectorAll(".half-dropdown");

            dropdowns.forEach(dropdown => {

                if (this.checked) {
                    dropdown.classList.remove("hidden");
                } else {
                    dropdown.classList.add("hidden");
                }

            });

        });


        // Initialize
        createCalendar();

    </script>

</body>
</html>
